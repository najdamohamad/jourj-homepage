<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jour J — Automatisez les célébrations d'équipe à Paris</title>
<meta name="description" content="Jour J aide les équipes RH à automatiser les anniversaires et anniversaires de travail des collaborateurs : règles, validation manager, préférences alimentaires, pâtisseries partenaires et livraison à Paris." />
<link rel="icon" href="assets/jour_j_calendar_icon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --forest: #2D5A3D;
    --forest-deep: #1F4530;
    --cream: #FAF7F2;
    --cream-deep: #F2EDE3;
    --coral: #E8735A;
    --coral-soft: #F4A793;
    --gold: #D4A843;
    --sage: #6B9E7E;
    --sage-pale: #DCE8DF;
    --mint: #EAF1EA;
    --charcoal: #1C1C1C;
    --muted: #6B6F6A;
    --line: rgba(28, 28, 28, 0.08);
    --line-strong: rgba(28, 28, 28, 0.14);
    --radius-sm: 12px;
    --radius: 18px;
    --radius-lg: 28px;
    --radius-xl: 40px;
    --shadow-soft: 0 1px 0 rgba(28,28,28,0.04), 0 8px 24px -10px rgba(28,28,28,0.08);
    --shadow-card: 0 1px 0 rgba(28,28,28,0.04), 0 14px 40px -16px rgba(28,28,28,0.12);
    --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--charcoal);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.55;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Type ---------- */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--forest);
    background: var(--sage-pale);
    padding: 6px 12px;
    border-radius: 999px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--coral);
  }
  h1, h2, h3, h4 { font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; margin: 0; color: var(--charcoal); }
  h1 { font-size: clamp(44px, 5.6vw, 78px); letter-spacing: -0.035em; line-height: 1.0; }
  h2 { font-size: clamp(32px, 3.6vw, 52px); letter-spacing: -0.025em; line-height: 1.05; }
  h3 { font-size: clamp(20px, 1.6vw, 24px); letter-spacing: -0.015em; }
  p { margin: 0; }
  .lead { font-size: clamp(17px, 1.25vw, 19px); color: var(--muted); line-height: 1.6; }

  /* ---------- Layout ---------- */
  .container { width: min(1240px, 92vw); margin: 0 auto; }
  section { padding: clamp(72px, 9vw, 128px) 0; position: relative; }
  .section-head { max-width: 760px; margin-bottom: clamp(40px, 5vw, 64px); }
  .section-head .lead { margin-top: 18px; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 15px;
    border: 1px solid transparent;
    transition: transform .2s ease, background .2s ease, box-shadow .2s ease, color .2s ease;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--forest);
    color: var(--cream);
    box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 8px 22px -10px rgba(45,90,61,0.5);
  }
  .btn-primary:hover { background: var(--forest-deep); transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    border-color: var(--line-strong);
    color: var(--charcoal);
  }
  .btn-ghost:hover { background: rgba(28,28,28,0.04); }
  .btn-coral { background: var(--coral); color: white; }
  .btn-coral:hover { background: #d96448; transform: translateY(-1px); }
  .btn .arrow { display: inline-block; transition: transform .2s ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 100;
    padding: 14px 0;
    transition: background .25s ease, backdrop-filter .25s ease, border-color .25s ease;
    border-bottom: 1px solid transparent;
  }
  .site-header.scrolled {
    background: rgba(250, 247, 242, 0.78);
    backdrop-filter: saturate(140%) blur(14px);
    -webkit-backdrop-filter: saturate(140%) blur(14px);
    border-bottom-color: var(--line);
  }
  .site-header .container {
    display: flex; align-items: center; gap: 32px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 19px; letter-spacing: -0.02em;
    color: var(--forest);
  }
  .brand-icon { width: 32px; height: 32px; }
  .brand-mark { font-weight: 800; letter-spacing: -0.03em; }
  .nav { display: flex; gap: 6px; margin-left: 12px; }
  .nav a {
    padding: 8px 14px; border-radius: 999px;
    font-size: 14.5px; font-weight: 500; color: var(--charcoal);
    transition: background .15s ease, color .15s ease;
  }
  .nav a:hover { background: rgba(28,28,28,0.05); }
  .header-cta { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .header-cta .btn { padding: 11px 18px; font-size: 14px; }
  .burger { display: none; }

  @media (max-width: 920px) {
    .nav { display: none; }
    .header-cta .btn-ghost { display: none; }
    .burger {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 999px;
      background: transparent; border: 1px solid var(--line-strong);
    }
  }

  /* ---------- Reveal ---------- */
  [data-reveal] {
    opacity: 0; transform: translateY(18px);
    transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1);
  }
  [data-reveal].in { opacity: 1; transform: none; }

</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header" id="siteHeader">
  <div class="container">
    <a href="#top" class="brand" aria-label="Jour J">
      <img src="assets/jour_j_calendar_icon.svg" alt="" class="brand-icon" />
      <span class="brand-mark">Jour J</span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#probleme">Problème</a>
      <a href="#fonctionnement">Fonctionnement</a>
      <a href="#perimetre">Périmètre</a>
      <a href="#fiabilite">Fiabilité</a>
      <a href="#tarifs">Pilote</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="header-cta">
      <a href="#fonctionnement" class="btn btn-ghost">Voir comment ça marche</a>
      <a href="#contact" class="btn btn-primary">Tester un pilote <span class="arrow">→</span></a>
      <button class="burger" aria-label="Menu">
        <svg width="18" height="12" viewBox="0 0 18 12"><path d="M0 1h18M0 6h18M0 11h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Sections will be injected by React -->
<main id="root"></main>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  // Manual serial loader: fetch each file, transform with Babel, eval.
  // Babel's auto-discovery only runs at startup so dynamic <script type="text/babel">
  // tags are ignored — we transform them by hand.
  (async function() {
    const files = [
      'components/icons.jsx',
      'components/hero.jsx',
      'components/sections.jsx',
      'components/dashboard.jsx',
      'components/footer.jsx',
      'app.jsx',
    ];
    while (!window.Babel) await new Promise(r => setTimeout(r, 30));
    for (const path of files) {
      let code;
      for (let a = 0; a < 5; a++) {
        try {
          const res = await fetch(path);
          if (!res.ok) throw new Error('http ' + res.status);
          code = await res.text();
          break;
        } catch(e) {
          if (a === 4) { console.error('giving up on', path, e); code = null; break; }
          await new Promise(r => setTimeout(r, 200 * (a + 1)));
        }
      }
      if (!code) continue;
      try {
        const out = Babel.transform(code, { presets: ['react'] }).code;
        const s = document.createElement('script');
        s.text = out;
        document.body.appendChild(s);
      } catch (e) {
        console.error('transform error in', path, e);
      }
    }
  })();
</script>

<script>
  // Sticky header style on scroll
  const header = document.getElementById('siteHeader');
  const onScroll = () => {
    if (window.scrollY > 6) header.classList.add('scrolled');
    else header.classList.remove('scrolled');
  };
  document.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Reveal on scroll
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  // Observe after React mounts
  setTimeout(() => {
    document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));
  }, 200);
  // And again on later mounts
  const mo = new MutationObserver(() => {
    document.querySelectorAll('[data-reveal]:not(.in)').forEach(el => io.observe(el));
  });
  mo.observe(document.body, { childList: true, subtree: true });
</script>
</body>
